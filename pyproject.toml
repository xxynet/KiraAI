[project]
name = "kiraai"
version = "2.28.2"
description = "A modular, multi-platform AI digital life system"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Keep in sync with requirements.txt — tests/test_pyproject_sync.py enforces it.
dependencies = [
    "bilibili_api_python>=17.4.0",
    "colorlog>=6.9.0",
    "python-telegram-bot~=21.3",
    "openai>=1.106.1",
    "Requests~=2.32.4",
    "tavily_python~=0.7.21",
    "uuid~=1.30",
    "websockets>=10.0",
    "PyJWT>=2.8.0",
    "fastapi>=0.124.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "psutil>=5.9.0",
    "fastmcp==2.14.4",
    "httpx>=0.28.1",
    "watchfiles>=1.1.1",
    "pycryptodome>=3.20.0",
    "qrcode>=7.4.2",
    "PyYAML>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "packaging>=21.0",
    "py-cord>=2.7.2",
    "deprecated>=1.2.13",
    "aiohttp>=3.14.1",
    "dashscope>=1.26.3",
]

[project.urls]
Homepage = "https://github.com/xxynet/KiraAI"
Documentation = "https://docs.kira-ai.top"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=0.23.0",
    # Needed by tests/test_pyproject_sync.py on Python 3.10 (no stdlib tomllib)
    "tomli>=2.0.0; python_version < '3.11'",
]

# KiraAI runs from a source checkout (python main.py); it is not installed as a
# package, so uv treats this as a virtual project and only manages dependencies.
[tool.uv]
package = false
