target-version = "py310"
extend-exclude = ["data"]

[lint]
extend-ignore = ["BLE001", "S110", "S112"]

[lint.per-file-ignores]
"tests/**" = [
    "F401",     # Pytest discovers imported fixtures by name.
    "F811",     # Fixture parameters intentionally shadow their imports.
    "ASYNC230", # Test setup and assertions use synchronous filesystem operations.
]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
