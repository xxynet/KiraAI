name: Build and push Docker image on release

on:
  release:
    types:
      - published

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: kira-ai

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}

      - name: Update latest for the current stable release
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          latest_release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .id)
          if [[ "$RELEASE_ID" == "$latest_release_id" ]]; then
            image="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            docker buildx imagetools create --tag "${image}:latest" "${image}@${IMAGE_DIGEST}"
          fi
