name: Ruff

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install ruff==0.17.3

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff check
        run: >
          ruff check .
          --output-format=github