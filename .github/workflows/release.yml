name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VERSION matches tag
        id: check
        run: |
          FILE_VERSION=$(python -c "import importlib.util; s=importlib.util.spec_from_file_location('m','core/config/default.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.VERSION)")
          TAG_VERSION="${{ github.ref_name }}"
          echo "FILE_VERSION=$FILE_VERSION"
          echo "TAG_VERSION=$TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION mismatch: core/config/default.py says '$FILE_VERSION' but tag is '$TAG_VERSION'"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build-frontend.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: release-assets

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          RANGE="${PREV_TAG}..${CURRENT_TAG}"
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          # Commit fields are separated by 0x1F so author names containing '|'
          # cannot shift columns (that once leaked an author email into a title).
          # "by @user" is resolved from the repo's merged PR list in one API call;
          # the commit author email is only a fallback for direct pushes carrying
          # a GitHub noreply address.
          MERGED_MAP=$(mktemp)
          MERGED_RAW=$(gh pr list --repo "${{ github.repository }}" --state merged --limit 500 \
            --json number,author,mergeCommit \
            --jq '.[] | "\(.mergeCommit.oid // "-") #\(.number) \(.author.login // "")"' 2>/dev/null) || true
          if [ -n "$MERGED_RAW" ]; then
            printf '%s\n' "$MERGED_RAW" > "$MERGED_MAP"
          else
            echo "::warning::Could not list merged PRs; falling back to commit-email-based attribution"
          fi

          pr_by_sha() { awk -v h="$1" '$1 != "-" && index($1, h) == 1 { print $2; exit }' "$MERGED_MAP"; }
          login_by_pr() { awk -v p="$1" '$2 == p { print $3; exit }' "$MERGED_MAP"; }
          login_by_email() { echo "$1" | grep -oP '([0-9]+\+)?\K[^@]+(?=@users\.noreply\.github\.com)' || true; }

          EMAIL_LOGINS=$(mktemp)
          while IFS=$'\x1f' read -r hash author email msg; do
            PR=""
            GH_USER=""
            PR=$(pr_by_sha "$hash")
            if [ -n "$PR" ]; then
              GH_USER=$(login_by_pr "$PR")
            else
              PR=$(echo "$msg" | grep -oE '\(#[0-9]+\)' | tr -d '()' | head -1)
              if [ -n "$PR" ]; then
                GH_USER=$(login_by_pr "$PR")
              fi
            fi
            if [ -z "$GH_USER" ]; then
              GH_USER=$(login_by_email "$email")
            fi
            if [ -n "$GH_USER" ]; then
              echo "$email $GH_USER" >> "$EMAIL_LOGINS"
            fi
            TITLE="$msg"
            [ -n "$PR" ] && TITLE=${msg%" (${PR})"}
            if [ -n "$GH_USER" ] && [ -n "$PR" ]; then
              echo "* ${TITLE} by @${GH_USER} in ${PR}" >> release_notes.md
            elif [ -n "$GH_USER" ]; then
              echo "* ${TITLE} by @${GH_USER} in ${hash}" >> release_notes.md
            elif [ -n "$PR" ]; then
              echo "* ${TITLE} in ${PR}" >> release_notes.md
            else
              echo "* ${TITLE} in ${hash}" >> release_notes.md
            fi
          done < <(git log "$RANGE" --pretty=format:"%h%x1f%aN%x1f%aE%x1f%s" --no-merges --reverse | { grep -vi 'chore: bump version to ' || true; })
          COMMIT_COUNT=$(git log "$RANGE" --no-merges --oneline | grep -cv 'chore: bump version to ' || true)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::warning::No commits found between ${PREV_TAG} and ${CURRENT_TAG}, release notes may be incomplete"
          fi
          echo "" >> release_notes.md
          NEW_CONTRIBUTORS=""
          CURRENT_AUTHORS=$(git log "$RANGE" --pretty=format:"%aN%x1f%aE" --no-merges | sort -u)
          PREV_AUTHORS=$(git log "$PREV_TAG" --pretty=format:"%aN%x1f%aE" | sort -u)
          while IFS=$'\x1f' read -r name email; do
            if [ -z "$email" ]; then
              continue
            fi
            if ! grep -qFx "${name}"$'\x1f'"${email}" <<< "$PREV_AUTHORS"; then
              GH_USER=$(awk -v e="$email" '$1 == e { print $2; exit }' "$EMAIL_LOGINS")
              if [ -z "$GH_USER" ]; then
                GH_USER=$(login_by_email "$email")
              fi
              if [ -n "$GH_USER" ]; then
                PR=$(git log "$RANGE" --author="$email" --pretty=format:"%s" --no-merges | grep -oE '\(#[0-9]+\)' | tr -d '()' | head -1)
                if [ -n "$PR" ]; then
                  NEW_CONTRIBUTORS="${NEW_CONTRIBUTORS}* @${GH_USER} made their first contribution in ${PR}"$'\n'
                else
                  NEW_CONTRIBUTORS="${NEW_CONTRIBUTORS}* @${GH_USER} made their first contribution"$'\n'
                fi
              fi
            fi
          done <<< "$CURRENT_AUTHORS"
          if [ -n "$NEW_CONTRIBUTORS" ]; then
            echo "## New Contributors" >> release_notes.md
            echo "" >> release_notes.md
            echo "$NEW_CONTRIBUTORS" >> release_notes.md
          fi
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md
          rm -f "$MERGED_MAP" "$EMAIL_LOGINS"

      - name: Check if pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -q '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-assets/dist.zip
          generate_release_notes: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          token: ${{ secrets.PAT }}
