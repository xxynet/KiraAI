name: WebUI CI

# Frontend (Vue 3 + Vite) checks for the admin WebUI.
# The Python side of the WebUI is covered by the Tests workflow.
#
# No `paths` filter on purpose: a filtered workflow is skipped for pull requests
# that only touch other areas, so a required check would leave those PRs waiting
# on a status that never arrives. The job is short enough to run on every PR.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 matches the version used by the release build (build-frontend.yml).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit suites plus the CN/EN i18n parity check.
      - name: Run unit tests
        run: npm test

      # Same command the release pipeline runs: vue-tsc type check + Vite bundle.
      - name: Type check and build
        run: npm run build
