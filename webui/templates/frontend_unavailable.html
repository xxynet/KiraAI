<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$page_title · KiraAI</title>
  <script>
    (() => {
      let language;
      try { language = localStorage.getItem('language'); } catch (_) {}
      if (language !== 'zh' && language !== 'en') {
        language = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }
      document.documentElement.lang = language;
      let theme;
      try { theme = localStorage.getItem('theme'); } catch (_) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <style>
    /* Mirror LoginView.vue and the matching semantic colors in tokens.css. */
    :root { color-scheme: light; --page: #f2f2f3; --surface: rgba(255,255,255,.7); --text: #111827; --body: #374151; --muted: #4b5563; --subtle: #6b7280; --border: rgba(255,255,255,.3); --line: rgba(209,213,219,.5); --accent: #1d4ed8; --step-bg: #dbeafe; --step-text: #1d4ed8; }
    :root.dark { color-scheme: dark; --page: #16161a; --surface: rgba(31,41,55,.7); --text: #f9fafb; --body: #e5e7eb; --muted: #cbd5e1; --subtle: #b4bcc8; --border: rgba(55,65,81,.3); --line: rgba(75,85,99,.3); --accent: #93c5fd; --step-bg: rgba(30,58,138,.5); --step-text: #93c5fd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 24px 32px; background: var(--page); color: var(--text); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
    html:lang(en) [data-language="zh"], html:lang(zh) [data-language="en"] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .light-spot { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .6; pointer-events: none; }
    .light-spot-1 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(59,130,246,.4) 0%, transparent 70%); top: 10%; left: 10%; }
    .light-spot-2 { width: 250px; height: 250px; background: radial-gradient(circle, rgba(147,197,253,.4) 0%, transparent 70%); top: 60%; right: 15%; animation-delay: 2s; }
    .light-spot-3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(167,139,250,.4) 0%, transparent 70%); bottom: 15%; left: 25%; animation-delay: 4s; }
    .dark .light-spot { opacity: .3; }
    .dark .light-spot-1 { background: radial-gradient(circle, rgba(59,130,246,.3) 0%, transparent 70%); }
    .dark .light-spot-2 { background: radial-gradient(circle, rgba(99,102,241,.3) 0%, transparent 70%); }
    .dark .light-spot-3 { background: radial-gradient(circle, rgba(139,92,246,.3) 0%, transparent 70%); }
    .shell { position: relative; z-index: 1; width: 100%; max-width: 512px; }
    .toolbar { position: fixed; top: 16px; right: 16px; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .languages, .theme-toggle { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); backdrop-filter: blur(12px); box-shadow: 0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a; }
    .languages { display: flex; padding: 4px; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    .languages button { padding: 5px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; }
    .languages button[aria-pressed="true"] { color: var(--step-text); background: var(--step-bg); }
    .theme-toggle { display: grid; place-items: center; padding: 8px; color: var(--body); }
    .theme-toggle svg { width: 24px; height: 24px; }
    .sun { display: none; color: #eab308; }
    .dark .sun { display: block; }
    .dark .moon { display: none; }
    .dark .light-label, html:not(.dark) .dark-label { display: none; }
    main { padding: 32px; background: var(--surface); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 25px -5px #0000001a, 0 8px 10px -6px #0000001a; }
    .hero { text-align: center; margin-bottom: 32px; }
    .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 16px; border-radius: 16px; background: transparent; color: var(--text); border: 1px solid #d1d5db; }
    .dark .brand-mark { border-color: #4b5563; }
    .brand-mark svg { width: 32px; height: 32px; }
    h1 { margin: 0 0 8px; font-size: 30px; font-weight: 700; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
    h2 { font-size: 14px; font-weight: 500; margin: 0 0 16px; color: var(--body); }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 24px; }
    li { display: flex; gap: 12px; }
    .number { flex: 0 0 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--step-text); background: var(--step-bg); font-size: 14px; font-weight: 600; }
    h3 { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
    li p { font-size: 14px; }
    .actions { margin: 24px 0; }
    .refresh { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; border: 1px solid transparent; background: #2563eb; color: #fff; border-radius: 12px; box-shadow: 0 1px 2px #0000000d; text-decoration: none; font-size: 14px; font-weight: 500; }
    .refresh svg { width: 20px; height: 20px; }
    .refresh:hover { background: #1d4ed8; }
    .refresh:active { transform: scale(.98); }
    .actions p { font-size: 12px; color: var(--subtle); margin-top: 8px; }
    details { border-top: 1px solid var(--line); padding-top: 20px; font-size: 14px; }
    summary { cursor: pointer; font-weight: 500; color: var(--body); }
    details p { margin-top: 12px; overflow-wrap: anywhere; }
    .download { display: inline-block; margin-top: 12px; color: var(--accent); text-underline-offset: 4px; }
    footer { margin-top: 32px; text-align: center; font-size: 12px; }
    footer p { color: var(--subtle); }
    .visitor-note { margin-bottom: 12px; }
    :focus-visible { outline: 2px solid #3b82f6; outline-offset: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      .light-spot { animation: login-float 8s ease-in-out infinite; }
      .light-spot-2 { animation-delay: 2s; }
      .light-spot-3 { animation-delay: 4s; }
      button, a { transition: background-color .2s, color .2s, transform .2s; }
      .refresh:hover { transform: scale(1.02); }
      @keyframes login-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
    }
    @media (max-width: 380px) {
      body { padding-left: 16px; padding-right: 16px; }
      main { padding: 24px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="light-spot light-spot-1" aria-hidden="true"></div>
  <div class="light-spot light-spot-2" aria-hidden="true"></div>
  <div class="light-spot light-spot-3" aria-hidden="true"></div>
  <div class="toolbar">
    <div class="languages" role="group" aria-labelledby="language-label">
      <span id="language-label" class="sr-only">$language_label</span>
      <button type="button" lang="zh" data-locale="zh">中文</button>
      <button type="button" lang="en" data-locale="en">English</button>
    </div>
    <button class="theme-toggle" type="button">
      <span class="sr-only light-label">$switch_to_dark</span>
      <span class="sr-only dark-label">$switch_to_light</span>
      <svg class="moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      <svg class="sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
    </button>
  </div>
  <div class="shell">
    <main>
      <div class="hero">
        <div class="brand-mark" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg></div>
        <h1>$title</h1>
        <p>$description</p>
      </div>
      <h2>$steps_title</h2>
      <ol>
        <li><span class="number" aria-hidden="true">1</span><div><h3>$logs_title</h3><p>$logs_body</p></div></li>
        <li><span class="number" aria-hidden="true">2</span><div><h3>$restart_title</h3><p>$restart_body</p></div></li>
      </ol>
      <div class="actions">
        <a class="refresh" href=""><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>$refresh</a>
        <p>$refresh_note</p>
      </div>
      <details>
        <summary>$manual_title</summary>
        <p>$manual_body</p>
        <a class="download" href="$release_url" target="_blank" rel="noopener noreferrer">$release</a>
        <p>$source_body</p>
      </details>
      <footer><p class="visitor-note">$visitor_note</p><p>KiraAI WebUI</p></footer>
    </main>
  </div>
  <script>
    const buttons = document.querySelectorAll('[data-locale]');
    function updateLanguage(language) {
      document.documentElement.lang = language;
      document.title = document.querySelector('h1 [data-language="' + language + '"]').textContent + ' · KiraAI';
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.locale === language)));
    }
    buttons.forEach(button => button.addEventListener('click', () => {
      const language = button.dataset.locale;
      updateLanguage(language);
      try { localStorage.setItem('language', language); } catch (_) {}
    }));
    updateLanguage(document.documentElement.lang);
    document.querySelector('.theme-toggle').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (_) {}
    });
  </script>
</body>
</html>
